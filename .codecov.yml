# Codecov configuration. Requires the Codecov GitHub App installed on the repo
# and a CODECOV_TOKEN secret (used by the upload step in ci.yml).
coverage:
  precision: 1
  round: down
  range: "70...100"
  status:
    project:
      default:
        # Block a coverage DROP vs the base branch (1% tolerance), without
        # imposing an absolute target — safe while overall coverage is low.
        target: auto
        threshold: 1%
    patch:
      default:
        # New code stays non-blocking until the test suite grows; tighten later.
        informational: true
    changes: false

comment:
  layout: "reach, diff, flags, files"
  require_changes: true

github_checks:
  annotations: true

ignore:
  - "e2e/**"
  - "**/*.config.*"
  - "**/*.test.ts"
