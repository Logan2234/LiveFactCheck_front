name: Frontend CI

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".vscode/**"
      - ".editorconfig"
      - ".gitignore"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".vscode/**"
      - ".editorconfig"
      - ".gitignore"
  schedule:
    # Nightly full e2e suite (03:00 UTC — off the top of the hour to dodge load spikes).
    - cron: "0 3 * * *"

# Least privilege: jobs only read the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref — but only for PRs, so main/nightly
# runs always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Format & type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prettier — format check
        run: npm run format:check

      - name: Eslint — lint check
        run: npm run lint

      - name: svelte-check — TypeScript & template types
        run: npm run check

      - name: Knip — unused files, deps & exports
        run: npm run knip

  test-unit:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Vitest (with coverage)
        run: npm run test:coverage

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/lcov.info
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Fast e2e subset on PRs: only @smoke-tagged tests, for quick feedback.
  e2e-smoke:
    name: E2E smoke (Playwright)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Browser download is skipped when the cache hit restores it; --with-deps
      # still installs the OS libraries each run (apt, not cached).
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Playwright — smoke
        run: npx playwright test --grep @smoke

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke
          path: playwright-report/
          retention-days: 7

  # Full e2e suite off the PR path (push to main + nightly), sharded for speed.
  e2e-full:
    name: E2E full (Playwright)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2]
        shardTotal: [2]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Playwright — shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }} --reporter=blob

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report/
          retention-days: 1

  # Merge the sharded blob reports into a single HTML report.
  e2e-report:
    name: E2E report (merge shards)
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    needs: [e2e-full]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v8
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into HTML report
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  bundle-size:
    name: Bundle size (size-limit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: size-limit
        run: npm run size

  # Single aggregate status for branch protection. Treats skipped jobs (e.g. the
  # e2e tier that didn't run for this event) as success, fails on any real failure.
  ci-passed:
    name: CI passed
    if: ${{ always() }}
    needs: [check, test-unit, e2e-smoke, e2e-full, bundle-size]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        run: |
          results="${{ needs.check.result }} ${{ needs.test-unit.result }} ${{ needs.e2e-smoke.result }} ${{ needs.e2e-full.result }} ${{ needs.bundle-size.result }}"
          echo "Job results: $results"
          for r in $results; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "::error::A required job did not succeed (result: $r)."
              exit 1
            fi
          done
          echo "All required jobs passed."
